<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="CSS-first visual library for Alumna apps. Vega-inspired look. Copy two CSS files and paste snippets.">
	<meta name="theme-color" content="oklch(1 0 0)">
	<title>Alumna Shadcn</title>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<script>
		try {
			var theme = localStorage.getItem('theme');
			var source = localStorage.getItem('themeSource');
			var html = document.documentElement;
			var os = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			if (source === 'system' || (!source && !theme)) {
				theme = os;
				source = 'system';
			} else {
				if (theme !== 'dark' && theme !== 'light')
					theme = os;
				source = 'user';
			}
			html.classList.add(theme);
			localStorage.setItem('theme', theme);
			localStorage.setItem('themeSource', source);
			document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? 'oklch(0.145 0 0)' : 'oklch(1 0 0)';
		} catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/alumna.css">
	<link rel="stylesheet" href="/css/alumna-shadcn.css">
	<link rel="stylesheet" href="/css/site.css">
	<script src="/js/prism.js" data-manual></script>
</head>
<body>
</body>
</html>
